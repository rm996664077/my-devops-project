name: Pipeline CI DevOps

# Déclencheur : s'exécute lors d'un push sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code du dépôt
    - name: Récupération du code (Checkout)
      uses: actions/checkout@v4

    # 2. Configurer Python
    - name: Configuration de Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Installer les dépendances
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Lancer les tests
    - name: Exécution des tests avec Pytest
      run: |
        python -m pytest

    # 5. Tester la construction de l'image Docker
    - name: Build de l'image Docker
      run: |
        docker build -t my-devops-app:latest .